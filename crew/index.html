<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Join a MapCrumbs Crew" />
    <title>Join MapCrumbs Crew</title>
    <link rel="stylesheet" href="../share/styles.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <img class="brand-logo" src="../share/assets/app-logo.png" width="48" height="56" alt="" />
        <h1>MapCrumbs</h1>
        <p>Join a travel Crew</p>
      </header>
      <section class="card">
        <p class="preview-label">Crew invite</p>
        <h2 class="preview-title">Compare travel progress together</h2>
        <p class="preview-subtitle">Open this invite in MapCrumbs. If I install first, I reopen this link after setup.</p>
        <div class="actions">
          <a id="open-app" class="store-btn store-btn-primary" href="#">Open in MapCrumbs</a>
          <a class="store-btn" href="https://apps.apple.com/app/id1572710265">Get MapCrumbs</a>
          <a class="store-btn" href="https://play.google.com/store/apps/details?id=app.mapcrumbs">Get it on Google Play</a>
        </div>
      </section>
    </main>
    <script>
      const token = new URLSearchParams(location.search).get('i');
      const open = document.getElementById('open-app');
      if (!token || !/^[A-Za-z0-9_-]{20,120}$/.test(token)) {
        open.hidden = true;
      } else {
        open.href = `org.lumi.mapcrumbs://crew?i=${encodeURIComponent(token)}`;
      }
    </script>
  </body>
</html>
